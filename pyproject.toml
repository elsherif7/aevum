[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aevum"
version = "2.2.3"
description = "Media Library Scanner"
requires-python = ">=3.8"

[project.optional-dependencies]
secure = [
    "keyring>=24.0",
    "cryptography>=41.0",
]

[project.scripts]
aevum = "aevum_pkg._cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aevum_pkg*"]

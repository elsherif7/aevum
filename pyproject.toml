[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aevum"
version = "1.0.0"
description = "Media Library Scanner"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Abdulrahman Elsherif" }
]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
aevum = "aevum_pkg._cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aevum_pkg*"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long — long f-strings with ANSI codes are intentional
]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Only check annotated modules — unannotated modules are skipped until
# they receive annotations in a future pass.
files = [
    "aevum_pkg/_models.py",
    "aevum_pkg/_scan.py",
    "aevum_pkg/_apikey.py",
    "aevum_pkg/_youtube.py",
    "aevum_pkg/_cli_helpers.py",
    "aevum_pkg/_display.py",
    "aevum_pkg/_cli_cmds.py",
]

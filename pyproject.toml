[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aevum"
version = "2.3.0"
description = "Media Library Scanner"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Abdulrahman Elsherif" }
]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
secure = [
    "keyring>=24.0",
    "cryptography>=41.0",
]
dev = [
    "pytest>=9.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
aevum = "aevum_pkg._cli:main"
aevum-clean = "clean:clean"

[tool.setuptools.packages.find]
where = ["."]
include = ["aevum_pkg*"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long — long f-strings with ANSI codes are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Only check annotated modules — unannotated modules are skipped until
# they receive annotations in a future pass.
files = [
    "aevum_pkg/_models.py",
    "aevum_pkg/_cache.py",
    "aevum_pkg/_config.py",
    "aevum_pkg/_scan.py",
    "aevum_pkg/_apikey.py",
    "aevum_pkg/_export.py",
    "aevum_pkg/_youtube.py",
    "aevum_pkg/_cli_json.py",
    "aevum_pkg/_cli_helpers.py",
    "aevum_pkg/_history.py",
    "aevum_pkg/_dupes.py",
    "aevum_pkg/_compare.py",
    "aevum_pkg/_display.py",
]
